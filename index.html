<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KyivUSD - Моніторинг курсів валют</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 50px 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            max-width: 500px; 
            width: 100%;
            text-align: center;
        }
        .logo { 
            width: 80px; 
            height: 80px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%; 
            margin: 0 auto 25px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 36px; 
            font-weight: bold;
        }
        h1 { 
            margin: 0 0 15px; 
            font-size: 32px; 
            color: #2d3748;
            font-weight: 700;
        }
        .description { 
            color: #4a5568; 
            margin: 0 0 30px; 
            font-size: 16px; 
            line-height: 1.6;
        }
        .features {
            text-align: left;
            margin: 25px 0;
            padding: 20px;
            background: #f7fafc;
            border-radius: 12px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-size: 15px;
            color: #2d3748;
        }
        .feature-icon {
            font-size: 20px;
            margin-right: 12px;
            min-width: 24px;
        }
        .telegram-btn { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px; 
            padding: 16px 40px; 
            background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%);
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 18px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .telegram-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.4);
        }
        .telegram-icon {
            margin-right: 10px;
            font-size: 22px;
        }
        .lang-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #4a5568;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="lang-indicator" id="langIndicator">🌍 ...</div>
    
    <div class="container">
        <div class="logo">$</div>
        
        <div id="content">
            <!-- Контент будет загружен через JavaScript -->
        </div>
    </div>

    <script>
        // Тексты на двух языках
        const translations = {
            uk: {
                title: "KyivUSD",
                description: "Актуальний моніторинг курсів валют в Україні. Отримуйте точну інформацію про курси долара, євро та інших валют у реальному часі.",
                features: [
                    { icon: "📊", text: "Курси валют у реальному часі" },
                    { icon: "💱", text: "USD, EUR та інші валюти" },
                    { icon: "🔔", text: "Миттєві сповіщення про зміни" },
                    { icon: "📱", text: "Зручний Telegram-канал" }
                ],
                button: "Підписатися в Telegram",
                langName: "Українська"
            },
            en: {
                title: "KyivUSD",
                description: "Real-time currency exchange rate monitoring in Ukraine. Get accurate information about USD, EUR and other currency rates instantly.",
                features: [
                    { icon: "📊", text: "Real-time currency rates" },
                    { icon: "💱", text: "USD, EUR and other currencies" },
                    { icon: "🔔", text: "Instant change notifications" },
                    { icon: "📱", text: "Convenient Telegram channel" }
                ],
                button: "Subscribe on Telegram",
                langName: "English"
            }
        };

        // Определение языка по IP
        async function detectLanguage() {
            try {
                // Используем бесплатный API для определения страны
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                // Если пользователь из Украины - показываем украинский
                if (data.country_code === 'UA') {
                    return 'uk';
                }
                
                // Для всех остальных - английский
                return 'en';
            } catch (error) {
                console.log('Language detection failed, using English');
                return 'en'; // По умолчанию английский
            }
        }

        // Рендеринг контента
        function renderContent(lang) {
            const content = translations[lang];
            const contentDiv = document.getElementById('content');
            
            let featuresHTML = '';
            content.features.forEach(feature => {
                featuresHTML += `
                    <div class="feature-item">
                        <span class="feature-icon">${feature.icon}</span>
                        <span>${feature.text}</span>
                    </div>
                `;
            });
            
            contentDiv.innerHTML = `
                <h1>${content.title}</h1>
                <p class="description">${content.description}</p>
                
                <div class="features">
                    ${featuresHTML}
                </div>
                
                <a href="https://t.me/kyivusd" class="telegram-btn" target="_blank">
                    <span class="telegram-icon">✈️</span>
                    ${content.button}
                </a>
            `;
            
            // Обновляем индикатор языка
            document.getElementById('langIndicator').textContent = `🌍 ${content.langName}`;
            
            // Обновляем title страницы
            document.title = lang === 'uk' 
                ? 'KyivUSD - Моніторинг курсів валют' 
                : 'KyivUSD - Currency Rate Monitoring';
        }

        // Запуск
        (async function() {
            const lang = await detectLanguage();
            renderContent(lang);
        })();
    </script>
</body>
</html>
